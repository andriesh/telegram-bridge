name: build-and-push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/telegram-bridge:${{ github.ref_name }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Tag latest
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/telegram-bridge:latest
          docker build -t $IMAGE .
          docker push $IMAGE